[package]
name = "mlx-serve-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "High-performance OpenAI-compatible LLM inference server for Apple Silicon in pure Rust using MLX"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/mlx-serve-rs"
homepage = "http://code.brandonhubbard.com/mlx-serve-rs/"

[[bin]]
name = "mlx-serve"
path = "src/bin/main.rs"

[lib]
name = "mlx_serve_rs"
path = "src/lib.rs"

[dependencies]
mlx-rs = "0.32.0"
axum = { version = "0.8", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rand = "0.8"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3.12"
